name: Weekly skill health check
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      # A record changes only when its result changes, so most weeks open no PR.
      - name: Open a pull request when results changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- web/data; then echo "No health changes."; exit 0; fi
          branch="health/$(date -u +%Y-%m-%d)"
          git config user.name "skillflux-bot"
          git config user.email "bot@skillflux.app"
          git checkout -b "$branch"
          git add web/data
          git commit -m "data: weekly health check $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create --title "Weekly health check $(date -u +%Y-%m-%d)" --body "Health records whose results changed this week. Review before merging."
