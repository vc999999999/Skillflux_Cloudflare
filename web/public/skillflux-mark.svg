<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <mask id="sfFluxMask">
      <rect x="0" y="0" width="64" height="64" fill="#000" />
      <rect x="6" y="6" width="52" height="52" rx="12" ry="12" fill="#fff" />
      <rect x="20" y="20" width="24" height="24" rx="4" ry="4" fill="#000" />
    </mask>
  </defs>

  <g mask="url(#sfFluxMask)">
    <!-- GREEN (Left Bar): #34A853 -->
    <rect x="6" y="6" width="14" height="52" fill="#34A853" />

    <!-- YELLOW (Bottom Bar): #FBBC04 -->
    <rect x="6" y="44" width="52" height="14" fill="#FBBC04" />
    <!-- Bottom-Left Overlap: Green folds over Yellow -->
    <rect x="6" y="44" width="14" height="14" fill="#188038" />

    <!-- RED (Right Bar): #EA4335 -->
    <rect x="44" y="6" width="14" height="52" fill="#EA4335" />
    <!-- Bottom-Right Overlap: Yellow folds over Red -->
    <rect x="44" y="44" width="14" height="14" fill="#F29900" />

    <!-- BLUE (Top Bar): #4285F4 -->
    <rect x="6" y="6" width="52" height="14" fill="#4285F4" />
    <!-- Top-Right Overlap: Red folds over Blue -->
    <rect x="44" y="6" width="14" height="14" fill="#D93025" />

    <!-- Top-Left Overlap: Blue folds over Green -->
    <rect x="6" y="6" width="14" height="14" fill="#1967D2" />
  </g>
</svg>
