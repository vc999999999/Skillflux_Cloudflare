map $uri $seo_filter_route {
  default 0;
  ~^/(?:en/)?(?:directory|registry(?:/page/[0-9]+)?)/(?:index\.html)?$ 1;
}
map $args $seo_has_filters {
  default 0;
  ~(^|&)(q|search|category|region|trust|kind|type|usecase|use-case|agent|host|recommended|sort|ownership|open-source|maintenance|offset)(=|&|$) 1;
}
map "$seo_filter_route:$seo_has_filters" $seo_robots {
  default "";
  "1:1" "noindex, follow";
}
map $seo_robots $seo_meta_robots {
  default "index, follow";
  "noindex, follow" "noindex, follow";
}
map $seo_robots $seo_cache {
  default "public, max-age=0, s-maxage=300, stale-while-revalidate=600";
  "noindex, follow" "private, no-store";
}
include /etc/nginx/skillflux-pagination.conf;
server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/skillflux-redirects.conf;
  error_page 404 /404.html;
  if ($seo_page_redirect != "") { return 301 $seo_page_redirect$seo_page_query; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag $seo_robots always;
  add_header Cache-Control $seo_cache;
  sub_filter_once on;
  sub_filter '<meta name="robots" content="index, follow"' '<meta name="robots" content="$seo_meta_robots"';

  location = /_nginx-redirects.conf { return 404; }
  location = /_nginx-pagination.conf { return 404; }
  location = /_worker.js { return 404; }
  location = /_routes.json { return 404; }
  location = /_redirects { return 404; }
  location = /_headers { return 404; }
  location = /.assetsignore { return 404; }
  location = /404.html { internal; }

  location = /health {
    proxy_pass http://registry:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /v1/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://registry:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /r/ {
    proxy_pass http://registry:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
